name: Security and release checks
on:
  push:
    branches: [staging, main, release/go-live]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rush_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: rush_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rush_test -d rush_audit_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: staging
      STAGING_DATABASE_CONFIRMED: 'true'
      STRIPE_MODE: test
      ALLOW_LIVE_PAYMENTS: 'false'
      NEXT_PUBLIC_SITE_URL: https://rush-staging.example.invalid
      DATABASE_URL: postgresql://rush_test:isolated-ci-only@127.0.0.1:5432/rush_audit_ci
      DIRECT_URL: postgresql://rush_test:isolated-ci-only@127.0.0.1:5432/rush_audit_ci
      RUSH_TEST_DATABASE_URL: postgresql://rush_test:isolated-ci-only@127.0.0.1:5432/rush_audit_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:migration
      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client-16
      - run: npm run test:backup
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
      - run: npm run test:http
